name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run when new commits are pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest

    # A throwaway Postgres for the integration tests, same version as compose.yaml
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sharer
          POSTGRES_PASSWORD: sharer
          POSTGRES_DB: sharer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharer -d sharer_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://sharer:sharer@localhost:5432/sharer_test

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
